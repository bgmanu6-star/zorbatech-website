<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Online Store (demo app)</title><meta name="robots" content="noindex"><meta name="theme-color" content="#e4572e">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap">
<style>*{box-sizing:border-box}:root{--a:#e4572e;--bg:#f3f4f9;--ink:#16182b;--mut:#646a84;--card:#fff;--ln:#e6e8f1;--ok:#14915a;--bad:#d23b3b;--sh:0 1px 2px rgba(20,20,50,.05),0 10px 24px -14px rgba(20,20,50,.25)}
body{margin:0;font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.zt{position:sticky;top:0;z-index:50;background:#0D0C2B;color:#fff;font-size:12px;display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between;align-items:center;padding:7px 14px}.zt b{color:#C6F432}.zt a{color:#fff;text-decoration:none;margin-left:12px}.zt a.go{background:#C6F432;color:#0D0C2B;font-weight:700;padding:4px 11px;border-radius:99px}
.ah{background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 55%,#0D0C2B));color:#fff;padding:18px 16px 46px;position:relative;overflow:hidden}
.ah:before{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;border:2px solid rgba(255,255,255,.25)}
.ah:after{content:"";position:absolute;right:30px;bottom:-70px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.ahr{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto;position:relative;z-index:1}
.lg{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(0,0,0,.4);flex:none}
.ht{flex:1;min-width:0}.ht b{display:block;font:800 21px Outfit,Inter,sans-serif;letter-spacing:-.01em}.ht span{font-size:13px;opacity:.85}
.avt{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.tg{max-width:760px;margin:10px auto 0;font-size:13px;opacity:.8;position:relative;z-index:1}
.app{max-width:760px;margin:-30px auto 0;padding:0 14px 120px;position:relative;z-index:2}h1{font-size:20px;margin:6px 0 2px}.sm{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px 16px;margin:12px 0;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.kpi{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;box-shadow:var(--sh);position:relative;overflow:hidden}.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--a)}.kpi small{color:var(--mut);display:block;font-weight:600;font-size:12.5px}.kpi b{font:800 21px Outfit,Inter,sans-serif}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}.row .l{min-width:0}.row .t{font-weight:700}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--a);color:#fff;font-weight:700}button.g{background:#eceef6;color:var(--ink)}button.sm2{padding:6px 11px;font-size:13px}
input,select{font:inherit;width:100%;padding:11px;border:1px solid var(--ln);border-radius:12px;background:#fff;color:var(--ink)}label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:10px 0 4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pos{color:var(--ok);font-weight:700}.neg{color:var(--bad);font-weight:700}
.fab{position:fixed;right:16px;bottom:84px;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);padding:14px 20px;border-radius:18px;z-index:30}
.sheet{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:60}.sheet.on{display:flex}.sheet>div{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px;max-height:90vh;overflow:auto}
.bar{display:flex;gap:8px;overflow:auto;padding:2px 0}.chip{white-space:nowrap;background:#eceef6;color:var(--ink);border-radius:99px}.chip.on{background:var(--a);color:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--ln);text-align:center}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff}.sc{overflow:auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(4,1fr);padding:4px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;padding:6px 2px;border-radius:12px}.nav button.on{color:var(--a)}.nav button.on svg{background:color-mix(in srgb,var(--a) 14%,#fff);border-radius:10px;padding:2px;width:40px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#16182b;color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;z-index:70;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}.toast.on{opacity:1}
.ph{height:120px;display:grid;place-items:center}.ph svg{filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
</style></head><body>
<div class="zt"><span><b>Demo app</b> by ZorbaTech. Your name, logo and items replace the placeholders.</span><span><a href="https://zorbatech.in/#demos">&larr; All demos</a><a class="go" href="https://wa.me/918610212131?text=Hi%20ZorbaTech%2C%20I%20tried%20the%20Your%20Online%20Store%20demo%20and%20want%20one%20for%20my%20business." target="_blank" rel="noopener">Get one like this</a></span></div>
<header class="ah"><div class="ahr"><div class="lg"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#e4572e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l1.5 13h-15z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg></div><div class="ht"><b>Your Online Store</b><span>Chennai · Free delivery above ₹499</span></div><div class="avt"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx=12 cy=8 r=4></circle><path d='M4 21a8 8 0 0 1 16 0'></path></svg></div></div><div class="tg">Shop online, order on WhatsApp</div></header>
<div class="app"><div class="kpi" style="margin-bottom:4px;background:linear-gradient(90deg,#fff3ee,#fff)"><small>This week only</small><b style="color:#e4572e">Up to 40% off · Free delivery above ₹499</b></div><div class="card"><div class="bar" id="cats"></div></div><div class="grid" id="pg" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))"></div><button class="fab" onclick="cart()" id="cb">Cart (0)</button><div class="sheet" id="sh"></div><div class="sm" style="margin-top:14px"><button class="g sm2" onclick="resetDemo()">Reset demo</button></div></div>
<nav class="nav"><button class="on" onclick="demoTab(this)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/></svg><span>Shop</span></button><button class="" onclick="demoTab(this)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Categories</span></button><button class="" onclick="demoTab(this)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l1.5 13h-15z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg><span>Orders</span></button><button class="" onclick="demoTab(this)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Account</span></button></nav><div class="toast" id="tst"></div>
<script>
const $=s=>document.querySelector(s),rs=n=>"₹"+Math.round(n).toLocaleString("en-IN"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY="zt-demo-store-1";let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function sheet(h){$("#sh").innerHTML="<div>"+h+"</div>";$("#sh").classList.add("on")}function closeSh(){$("#sh").classList.remove("on")}
$("#sh").onclick=e=>{if(e.target.id==="sh")closeSh()};
function resetDemo(){S=null;try{localStorage.removeItem(KEY)}catch(e){}init();}
function demoTab(b){document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");const t=$("#tst");t.textContent=b.textContent.trim()+" screen is part of the full app";t.classList.add("on");clearTimeout(window._tt);window._tt=setTimeout(()=>{t.classList.remove("on");document.querySelectorAll(".nav button").forEach((x,i)=>x.classList.toggle("on",i===0))},1600)}

const P=[["LED table lamp","Home",499,799],["Steel water bottle 1L","Home",349,599],["Non-stick fry pan","Kitchen",649,999],["Hand blender 400W","Kitchen",899,1399],["Wireless earbuds","Gadgets",999,1799],["Smart fitness watch","Gadgets",1299,2499],["Cotton round-neck T-shirt","Fashion",399,699],["Canvas tote bag","Fashion",299,549]];
const W='fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
const PI=['<path d="M8 3h8l3 8H5z"/><path d="M12 11v7M8 21h8"/>','<rect x="8" y="5" width="8" height="16" rx="3"/><path d="M10 2h4v3h-4zM8 10h8"/>','<circle cx="10" cy="13" r="7"/><path d="M17 13h5"/><circle cx="10" cy="13" r="3"/>','<path d="M9 2h6v6H9z"/><path d="M10 8l-1 6h6l-1-6M10 14v7h4v-7"/>','<path d="M6 13a3 3 0 0 1 3 3v3a2 2 0 0 1-4 0v-5M18 13a3 3 0 0 0-3 3v3a2 2 0 0 0 4 0v-5M4 15v-3a8 8 0 0 1 16 0v3"/>','<rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9 6V2h6v4M9 18v4h6v-4M12 10v3l2 1"/>','<path d="M8 3l-5 3 2 4 3-1v12h8V9l3 1 2-4-5-3a4 4 0 0 1-8 0z"/>','<path d="M5 8h14l-1 13H6z"/><path d="M9 11V6a3 3 0 0 1 6 0v5"/>'].map(p=>`<svg viewBox="0 0 24 24" width="64" height="64" ${W}>${p}</svg>`);
const CL=["#f4a259","#5b8e7d","#bc4b51","#8cb369","#3d5a80","#e4572e","#7b6d8d","#2a9d8f"];let cat="All";
function init(){if(!S){S={c:{}};save()}draw()}
function draw(){const cs=["All",...new Set(P.map(p=>p[1]))];$("#cats").innerHTML=cs.map(c=>`<button class="chip ${c===cat?"on":""}" onclick="cat='${c}';draw()">${c}</button>`).join("");
$("#pg").innerHTML=P.map((p,i)=>[p,i]).filter(([p])=>cat==="All"||p[1]===cat).map(([p,i])=>`<div class="kpi" style="padding:0;overflow:hidden"><div class="ph" style="background:linear-gradient(135deg,${CL[i]},color-mix(in srgb,${CL[i]} 45%,#fff))">${PI[i]}</div><div style="padding:10px"><div style="font-weight:600">${p[0]}</div><div class="sm">${p[1]}</div><div><b>${rs(p[2])}</b> <s class="sm">${rs(p[3])}</s></div><button class="sm2" style="width:100%;margin-top:8px" onclick="add(${i})">Add to cart</button></div></div>`).join("");
const n=Object.values(S.c).reduce((a,b)=>a+b,0);$("#cb").textContent="Cart ("+n+")"}
function add(i){S.c[i]=(S.c[i]||0)+1;save();draw()}
function cart(){const ks=Object.keys(S.c);let t=0;const L=ks.map(k=>{const p=P[k],q=S.c[k];t+=p[2]*q;return`<div class="row"><div class="l"><div class="t">${p[0]}</div><div class="sm">${rs(p[2])} x ${q}</div></div><button class="g sm2" onclick="rm(${k})">Remove</button></div>`}).join("")||"<div class='sm' style='padding:14px 0'>Your cart is empty</div>";
const msg=encodeURIComponent("Hi, I want to order: "+ks.map(k=>P[k][0]+" x"+S.c[k]).join(", ")+". Total "+rs(t));
sheet(`<b>Your cart</b>${L}<div class="row"><span>Total</span><b style="font-size:18px">${rs(t)}</b></div><div class="f2"><button class="g" onclick="closeSh()">Close</button><a class="btn" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/918610212131?text=${msg}">Order on WhatsApp</a></div>`)}
function rm(k){delete S.c[k];save();draw();cart()}
init();
</script></body></html>
