<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StaffDesk Attendance (demo app)</title><meta name="robots" content="noindex"><meta name="theme-color" content="#5b3fd0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap">
<style>*{box-sizing:border-box}:root{--a:#5b3fd0;--bg:#f3f4f9;--ink:#16182b;--mut:#646a84;--card:#fff;--ln:#e6e8f1;--ok:#14915a;--bad:#d23b3b;--sh:0 1px 2px rgba(20,20,50,.05),0 10px 24px -14px rgba(20,20,50,.25)}
body{margin:0;font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.zt{position:sticky;top:0;z-index:50;background:#0D0C2B;color:#fff;font-size:12px;display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between;align-items:center;padding:7px 14px}.zt b{color:#C6F432}.zt a{color:#fff;text-decoration:none;margin-left:12px}.zt a.go{background:#C6F432;color:#0D0C2B;font-weight:700;padding:4px 11px;border-radius:99px}
.ah{background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 55%,#0D0C2B));color:#fff;padding:18px 16px 46px;position:relative;overflow:hidden}
.ah:before{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;border:2px solid rgba(255,255,255,.25)}
.ah:after{content:"";position:absolute;right:30px;bottom:-70px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.ahr{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto;position:relative;z-index:1}
.lg{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(0,0,0,.4);flex:none}
.ht{flex:1;min-width:0}.ht b{display:block;font:800 21px Outfit,Inter,sans-serif;letter-spacing:-.01em}.ht span{font-size:13px;opacity:.85}
.avt{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.tg{max-width:760px;margin:10px auto 0;font-size:13px;opacity:.8;position:relative;z-index:1}
.app{max-width:760px;margin:-30px auto 0;padding:0 14px 120px;position:relative;z-index:2}h1{font-size:20px;margin:6px 0 2px}.sm{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px 16px;margin:12px 0;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.kpi{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;box-shadow:var(--sh);position:relative;overflow:hidden}.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--a)}.kpi small{color:var(--mut);display:block;font-weight:600;font-size:12.5px}.kpi b{font:800 21px Outfit,Inter,sans-serif}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}.row .l{min-width:0}.row .t{font-weight:700}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--a);color:#fff;font-weight:700}button.g{background:#eceef6;color:var(--ink)}button.sm2{padding:6px 11px;font-size:13px}
input,select{font:inherit;width:100%;padding:11px;border:1px solid var(--ln);border-radius:12px;background:#fff;color:var(--ink)}label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:10px 0 4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pos{color:var(--ok);font-weight:700}.neg{color:var(--bad);font-weight:700}
.fab{position:fixed;right:16px;bottom:84px;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);padding:14px 20px;border-radius:18px;z-index:30}
.sheet{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:60}.sheet.on{display:flex}.sheet>div{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px;max-height:90vh;overflow:auto}
.bar{display:flex;gap:8px;overflow:auto;padding:2px 0}.chip{white-space:nowrap;background:#eceef6;color:var(--ink);border-radius:99px}.chip.on{background:var(--a);color:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--ln);text-align:center}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff}.sc{overflow:auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(4,1fr);padding:4px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;padding:6px 2px;border-radius:12px}.nav button.on{color:var(--a)}.nav button.on svg{background:color-mix(in srgb,var(--a) 14%,#fff);border-radius:10px;padding:2px;width:40px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#16182b;color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;z-index:70;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}.toast.on{opacity:1}
.ph{height:120px;display:grid;place-items:center}.ph svg{filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}

@media(min-width:900px){
 .nav{top:34px;bottom:0;right:auto;width:250px;display:flex;flex-direction:column;gap:4px;padding:18px 14px;border-top:0;border-right:1px solid var(--ln);background:#fff}
 .nb{display:flex!important;align-items:center;gap:10px;padding:4px 6px 18px;margin-bottom:8px;border-bottom:1px solid var(--ln)}
 .nb .lg{width:40px;height:40px;background:color-mix(in srgb,var(--a) 12%,#fff);box-shadow:none}.nb b{display:block;font:800 17px Outfit,Inter,sans-serif}.nb small{color:var(--mut);font-size:12px}
 .nav button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:11px 12px}
 .nav button.on{background:color-mix(in srgb,var(--a) 12%,#fff)}.nav button.on svg{background:none;width:22px;padding:0}
 .ah,.app{margin-left:250px}
 .ah{padding:26px 36px 64px}.ahr,.tg{max-width:1100px}
 .app{max-width:1150px;padding:0 36px 60px;margin-top:-44px}
 .grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:14px}
 .card{padding:18px 22px}
 .fab{bottom:28px;right:32px}
 .sheet{align-items:center}.sheet>div{border-radius:22px;max-width:520px}
 .toast{bottom:40px}
 .ph{height:150px}
}
.nb{display:none}
</style></head><body>
<div class="zt"><span><b>Demo app</b> by ZorbaTech. Your name, logo and items replace the placeholders.</span><span><a href="https://zorbatech.in/#demos">&larr; All demos</a><a class="go" href="https://wa.me/918610212131?text=Hi%20ZorbaTech%2C%20I%20tried%20the%20StaffDesk%20demo%20and%20want%20one%20for%20my%20business." target="_blank" rel="noopener">Get one like this</a></span></div>
<header class="ah"><div class="ahr"><div class="lg"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#5b3fd0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 15l2 2 4-4"/></svg></div><div class="ht"><b>StaffDesk</b><span>Your Company Name · Chennai</span></div><div class="avt"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx=12 cy=8 r=4></circle><path d='M4 21a8 8 0 0 1 16 0'></path></svg></div></div><div class="tg">Attendance and salary</div></header>
<div class="app">
<div class="grid" style="margin-top:10px"><div class="kpi"><small>Staff</small><b id="k1"></b></div><div class="kpi"><small>Present today</small><b class="pos" id="k2"></b></div><div class="kpi"><small>Salary payable</small><b id="k3"></b></div></div>
<div class="card"><b>Mark today</b> <span class="sm">tap to change P → A → H (half day)</span><div id="today"></div></div>
<div class="card"><b>This month</b><div class="sc"><table id="tb"></table></div></div><div class="sm"><button class="g sm2" onclick="resetDemo()">Reset demo data</button></div><div class="sheet" id="sh"></div></div>
<nav class="nav"><div class="nb"><div class="lg"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#5b3fd0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 15l2 2 4-4"/></svg></div><div><b>StaffDesk</b><small>Your Company Name</small></div></div><button class="on" onclick="demoTab(this)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Today</span></button><button class="" onclick="demoTab(this)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/></svg><span>Staff</span></button><button class="" onclick="demoTab(this)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/></svg><span>Salary</span></button><button class="" onclick="demoTab(this)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Reports</span></button></nav><div class="toast" id="tst"></div>
<script>
const $=s=>document.querySelector(s),rs=n=>"₹"+Math.round(n).toLocaleString("en-IN"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY="zt-demo-attendance-1";let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function sheet(h){$("#sh").innerHTML="<div>"+h+"</div>";$("#sh").classList.add("on")}function closeSh(){$("#sh").classList.remove("on")}
$("#sh").onclick=e=>{if(e.target.id==="sh")closeSh()};
function resetDemo(){S=null;try{localStorage.removeItem(KEY)}catch(e){}init();}
function demoTab(b){document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");const t=$("#tst");t.textContent=b.textContent.trim()+" screen is part of the full app";t.classList.add("on");clearTimeout(window._tt);window._tt=setTimeout(()=>{t.classList.remove("on");document.querySelectorAll(".nav button").forEach((x,i)=>x.classList.toggle("on",i===0))},1600)}

const ND=new Date().getDate(),ST=["P","A","H"];
function init(){if(!S){const st=[["Suresh K","Supervisor",24000],["Manoj R","Machine operator",18000],["Bala S","Packer",13500],["Geetha M","Packer",13000],["Ibrahim","Driver",16000],["Vimala","Helper",11000]];
S={s:st.map((x,i)=>({n:x[0],r:x[1],w:x[2],a:Array.from({length:ND},(_,d)=>d===ND-1?"":((d+1+i)%7===0?"A":(d*3+i)%11===0?"H":((d+i)%7===6?"-":"P")))}))};save()}draw()}
const pay=s=>{const p=s.a.filter(x=>x==="P").length,h=s.a.filter(x=>x==="H").length,wd=s.a.filter(x=>x&&x!=="-").length||1;return{p,h,a:s.a.filter(x=>x==="A").length,amt:s.w/26*(p+h/2+ (26-wd>0?0:0))}};
function draw(){$("#k1").textContent=S.s.length;$("#k2").textContent=S.s.filter(s=>s.a[ND-1]==="P"||s.a[ND-1]==="H").length;$("#k3").textContent=rs(S.s.reduce((a,s)=>a+Math.min(s.w,pay(s).amt),0));
$("#today").innerHTML=S.s.map((s,i)=>{const v=s.a[ND-1];return`<div class="row"><div class="l"><div class="t">${esc(s.n)}</div><div class="sm">${s.r} · ${rs(s.w)}/month</div></div><button class="${v==="P"?"":"g"}" style="min-width:64px" onclick="tg(${i})">${v||"Mark"}</button></div>`}).join("");
$("#tb").innerHTML="<tr><th>Name</th><th>P</th><th>H</th><th>A</th><th>Pay so far</th></tr>"+S.s.map(s=>{const p=pay(s);return`<tr><td>${esc(s.n)}</td><td>${p.p}</td><td>${p.h}</td><td>${p.a}</td><td><b>${rs(Math.min(s.w,p.amt))}</b></td></tr>`}).join("")}
function tg(i){const a=S.s[i].a,v=a[ND-1];a[ND-1]=ST[(ST.indexOf(v)+1)%3];save();draw()}
init();
</script></body></html>
