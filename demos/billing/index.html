<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickBill GST Billing (demo app)</title><meta name="robots" content="noindex"><meta name="theme-color" content="#0b6bcb">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap">
<style>*{box-sizing:border-box}:root{--a:#0b6bcb;--bg:#f3f4f9;--ink:#16182b;--mut:#646a84;--card:#fff;--ln:#e6e8f1;--ok:#14915a;--bad:#d23b3b;--sh:0 1px 2px rgba(20,20,50,.05),0 10px 24px -14px rgba(20,20,50,.25)}
body{margin:0;font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.zt{position:sticky;top:0;z-index:50;background:#0D0C2B;color:#fff;font-size:12px;display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between;align-items:center;padding:7px 14px}.zt b{color:#C6F432}.zt a{color:#fff;text-decoration:none;margin-left:12px}.zt a.go{background:#C6F432;color:#0D0C2B;font-weight:700;padding:4px 11px;border-radius:99px}
.ah{background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 55%,#0D0C2B));color:#fff;padding:18px 16px 46px;position:relative;overflow:hidden}
.ah:before{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;border:2px solid rgba(255,255,255,.25)}
.ah:after{content:"";position:absolute;right:30px;bottom:-70px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.ahr{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto;position:relative;z-index:1}
.lg{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(0,0,0,.4);flex:none}
.ht{flex:1;min-width:0}.ht b{display:block;font:800 21px Outfit,Inter,sans-serif;letter-spacing:-.01em}.ht span{font-size:13px;opacity:.85}
.avt{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.tg{max-width:760px;margin:10px auto 0;font-size:13px;opacity:.8;position:relative;z-index:1}
.app{max-width:760px;margin:-30px auto 0;padding:0 14px 120px;position:relative;z-index:2}h1{font-size:20px;margin:6px 0 2px}.sm{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px 16px;margin:12px 0;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.kpi{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;box-shadow:var(--sh);position:relative;overflow:hidden}.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--a)}.kpi small{color:var(--mut);display:block;font-weight:600;font-size:12.5px}.kpi b{font:800 21px Outfit,Inter,sans-serif}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}.row .l{min-width:0}.row .t{font-weight:700}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--a);color:#fff;font-weight:700}button.g{background:#eceef6;color:var(--ink)}button.sm2{padding:6px 11px;font-size:13px}
input,select{font:inherit;width:100%;padding:11px;border:1px solid var(--ln);border-radius:12px;background:#fff;color:var(--ink)}label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:10px 0 4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pos{color:var(--ok);font-weight:700}.neg{color:var(--bad);font-weight:700}
.fab{position:fixed;right:16px;bottom:84px;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);padding:14px 20px;border-radius:18px;z-index:30}
.sheet{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:60}.sheet.on{display:flex}.sheet>div{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px;max-height:90vh;overflow:auto}
.bar{display:flex;gap:8px;overflow:auto;padding:2px 0}.chip{white-space:nowrap;background:#eceef6;color:var(--ink);border-radius:99px}.chip.on{background:var(--a);color:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--ln);text-align:center}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff}.sc{overflow:auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(4,1fr);padding:4px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;padding:6px 2px;border-radius:12px}.nav button.on{color:var(--a)}.nav button.on svg{background:color-mix(in srgb,var(--a) 14%,#fff);border-radius:10px;padding:2px;width:40px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#16182b;color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;z-index:70;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}.toast.on{opacity:1}
.ph{height:120px;display:grid;place-items:center}.ph svg{filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
</style></head><body>
<div class="zt"><span><b>Demo app</b> by ZorbaTech. Your name, logo and items replace the placeholders.</span><span><a href="https://zorbatech.in/#demos">&larr; All demos</a><a class="go" href="https://wa.me/918610212131?text=Hi%20ZorbaTech%2C%20I%20tried%20the%20QuickBill%20demo%20and%20want%20one%20for%20my%20business." target="_blank" rel="noopener">Get one like this</a></span></div>
<header class="ah"><div class="ahr"><div class="lg"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#0b6bcb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg></div><div class="ht"><b>QuickBill</b><span>Your Shop Name · Chennai</span></div><div class="avt"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx=12 cy=8 r=4></circle><path d='M4 21a8 8 0 0 1 16 0'></path></svg></div></div><div class="tg">GST bills in seconds</div></header>
<div class="app">
<div class="grid" style="margin-top:10px"><div class="kpi"><small>Today's sales</small><b id="k1"></b></div><div class="kpi"><small>Bills today</small><b id="k2"></b></div><div class="kpi"><small>GST collected</small><b id="k3"></b></div></div>
<div class="card"><b>Recent bills</b><div id="list"></div></div><div class="sm"><button class="g sm2" onclick="resetDemo()">Reset demo data</button></div>
<button class="fab" onclick="newBill()">+ New bill</button><div class="sheet" id="sh"></div></div>
<nav class="nav"><button class="on" onclick="demoTab(this)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/></svg><span>Home</span></button><button class="" onclick="demoTab(this)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/></svg><span>Bills</span></button><button class="" onclick="demoTab(this)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7l8-4 8 4-8 4z"/><path d="M4 7v10l8 4 8-4V7"/></svg><span>Items</span></button><button class="" onclick="demoTab(this)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Reports</span></button></nav><div class="toast" id="tst"></div>
<script>
const $=s=>document.querySelector(s),rs=n=>"₹"+Math.round(n).toLocaleString("en-IN"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY="zt-demo-billing-1";let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function sheet(h){$("#sh").innerHTML="<div>"+h+"</div>";$("#sh").classList.add("on")}function closeSh(){$("#sh").classList.remove("on")}
$("#sh").onclick=e=>{if(e.target.id==="sh")closeSh()};
function resetDemo(){S=null;try{localStorage.removeItem(KEY)}catch(e){}init();}
function demoTab(b){document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");const t=$("#tst");t.textContent=b.textContent.trim()+" screen is part of the full app";t.classList.add("on");clearTimeout(window._tt);window._tt=setTimeout(()=>{t.classList.remove("on");document.querySelectorAll(".nav button").forEach((x,i)=>x.classList.toggle("on",i===0))},1600)}

const ITEMS=[["Phone case",250,18],["Tempered glass",150,18],["USB-C cable 1m",220,18],["Fast charger 20W",699,18],["Earphones",499,18],["Power bank 10000mAh",1299,18],["Memory card 64GB",450,18],["Screen cleaning kit",120,12]];
const NAMES=["Arun Kumar","Priya S","Walk-in customer","Karthik R","Meena Stores","Walk-in customer"];
function init(){if(!S){const bills=[];let n=1040;for(let i=0;i<14;i++){const it=[ITEMS[(i*3)%8],ITEMS[(i*5+1)%8]];const d=new Date(Date.now()-Math.floor(i/4)*864e5);bills.push({no:n++,t:d.toISOString(),cust:NAMES[i%6],lines:it.map((x,j)=>({n:x[0],p:x[1],g:x[2],q:1+(i+j)%3}))})}S={bills,next:n};save()}draw()}
const tot=b=>{let s=0,g=0;b.lines.forEach(l=>{const a=l.p*l.q;s+=a;g+=a*l.g/100});return{s,g,t:s+g}};
function draw(){const td=new Date().toDateString(),tb=S.bills.filter(b=>new Date(b.t).toDateString()===td);$("#k1").textContent=rs(tb.reduce((a,b)=>a+tot(b).t,0));$("#k2").textContent=tb.length;$("#k3").textContent=rs(tb.reduce((a,b)=>a+tot(b).g,0));
$("#list").innerHTML=S.bills.slice().reverse().slice(0,12).map(b=>`<div class="row" onclick="view(${b.no})" style="cursor:pointer"><div class="l"><div class="t">#${b.no} · ${esc(b.cust)}</div><div class="sm">${new Date(b.t).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</div></div><b>${rs(tot(b).t)}</b></div>`).join("")}
let cur;function newBill(){cur={cust:"",lines:[]};form()}
function form(){const t=tot(cur);sheet(`<b>New bill #${S.next}</b><label>Customer</label><input id="cn" value="${esc(cur.cust)}" placeholder="Customer name" oninput="cur.cust=this.value"><label>Add item</label><div class="f2"><select id="si">${ITEMS.map((x,i)=>`<option value="${i}">${x[0]} · ${rs(x[1])}</option>`).join("")}</select><button onclick="addL()">Add</button></div>
${cur.lines.map((l,i)=>`<div class="row"><div class="l"><div class="t">${l.n}</div><div class="sm">${rs(l.p)} × ${l.q} · GST ${l.g}%</div></div><div><button class="g sm2" onclick="q(${i},-1)">−</button> ${l.q} <button class="g sm2" onclick="q(${i},1)">+</button></div></div>`).join("")}
<div class="row"><span class="sm">Subtotal ${rs(t.s)} + GST ${rs(t.g)}</span><b style="font-size:18px">${rs(t.t)}</b></div><div class="f2"><button class="g" onclick="closeSh()">Cancel</button><button onclick="done()">Save bill</button></div>`)}
function addL(){const x=ITEMS[$("#si").value],f=cur.lines.find(l=>l.n===x[0]);f?f.q++:cur.lines.push({n:x[0],p:x[1],g:x[2],q:1});form()}
function q(i,d){cur.lines[i].q+=d;if(cur.lines[i].q<1)cur.lines.splice(i,1);form()}
function done(){if(!cur.lines.length)return;S.bills.push({no:S.next++,t:new Date().toISOString(),cust:cur.cust||"Walk-in customer",lines:cur.lines});save();draw();view(S.next-1)}
function view(no){const b=S.bills.find(x=>x.no===no),t=tot(b);sheet(`<div style="text-align:center"><b>Your Shop Name</b><div class="sm">GSTIN: your number here · Chennai</div></div><div class="sm" style="margin:8px 0">Bill #${b.no} · ${esc(b.cust)}</div>${b.lines.map(l=>`<div class="row"><span>${l.n} × ${l.q}</span><span>${rs(l.p*l.q)}</span></div>`).join("")}<div class="row"><span class="sm">CGST+SGST (${rs(t.g)})</span><b>${rs(t.t)}</b></div><button class="g" style="width:100%" onclick="closeSh()">Close</button>`)}
init();
</script></body></html>
